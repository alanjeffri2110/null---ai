name: Build NULL AI APK
on: {workflow_dispatch: null}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: "3.11"}}, {uses: actions/setup-java@v5, with: {distribution: "temurin", java-version: "17"}}, {name: Install Buildozer, run: "pip install buildozer cython"}, {name: Prepare Android SDK, run: "sudo apt-get update && sudo apt-get install -y android-sdk && yes | sdkmanager --licenses || true"}, {name: Build APK, run: "rm -rf ~/.buildozer && buildozer android debug"}, {name: Upload APK, if: success(), uses: actions/upload-artifact@v4, with: {name: "NULL-AI-APK", path: "bin/*.apk"}}]}}
